<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>万物印</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #efe9dd; overflow: hidden; font-family: "PingFang SC", sans-serif; color: #4a4338; }
      canvas { display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      .caps { position: absolute; left: 0; right: 0; bottom: 3.2vh; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
      .caps b { display: block; font-size: 2.4vh; letter-spacing: 2px; }
      .caps span { font-size: 1.7vh; opacity: 0.75; }
      .tag { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; font-size: 2.1vh; line-height: 1.25; }
      .tag b { letter-spacing: 2px; }
      .tag span { display: block; font-size: 1.5vh; opacity: 0.7; }
      .head { position: absolute; left: 0; right: 0; top: 4vh; text-align: center; }
      .head b { display: block; font-size: 4.2vh; letter-spacing: 0.5vh; }
      .head span { font-size: 2vh; opacity: 0.75; }
      #cap { position: absolute; left: 0; right: 0; top: 7vh; text-align: center; font-size: 3.4vh; letter-spacing: 2px; } /* top: a flipped seal's knob hangs into the bottom of the frame */
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <script type="module" src="/src/seal.ts"></script>
  </body>
</html>
